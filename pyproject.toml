[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-effort-router"
version = "0.1.0"
description = "Offline-first task decomposition and model-effort routing with optional Jev decision signals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "model-effort-router contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
benchmark = ["tiktoken==0.12.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["model_effort_router*"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.unittest]
start-directory = "tests"
